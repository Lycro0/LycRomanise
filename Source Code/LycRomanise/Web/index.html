<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>LycRomanise</title>
<style>
  :root { --unsung:#ffe14d; --sung:#ff3d9a; --next:#ffe14d; --outline:#000; --sub:#ffffffe6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(120% 90% at 50% 0%, #1d1830 0%, #0b0b10 60%);
    color: #fff; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Hiragino Sans", "Noto Sans CJK", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body.obs { background: transparent; }
  header { position: fixed; top: 0; left: 0; right: 0; padding: 18px 22px; opacity: .75; font-size: 14px; }
  header b { display: block; font-size: 16px; }
  body.obs header, body.obs footer { display: none; }
  #stage { width: min(1100px, 94vw); text-align: center; }
  .line { font-weight: 800; font-size: clamp(26px, 6vw, 64px); line-height: 1.25; margin: 0; transition: transform .32s cubic-bezier(.2,.8,.2,1), opacity .32s; }
  .sub { font-weight: 600; font-size: clamp(16px, 3.4vw, 36px); line-height: 1.3; margin-top: 6px; }
  .tr { font-size: clamp(14px, 2.6vw, 26px); opacity: .8; margin-top: 6px; color: var(--sub); }
  .bg { font-size: clamp(13px, 2.6vw, 26px); font-style: italic; opacity: .85; margin-top: 4px; }
  .next { font-weight: 700; font-size: clamp(16px, 3.6vw, 34px); color: var(--next); opacity: .5; margin-top: 26px; }
  .trailing { text-align: right; } .leading.duet { text-align: left; }
  .w { -webkit-text-stroke: 0; paint-order: stroke fill;
       text-shadow: 0 0 2px var(--outline), 0 0 3px var(--outline), 0 0 12px rgba(0,0,0,.45);
       background: linear-gradient(90deg, var(--sung) var(--p), var(--unsung) calc(var(--p) + 6%));
       -webkit-background-clip: text; background-clip: text; color: transparent; --p: -6%; }
  .sub .w { background: linear-gradient(90deg, var(--sung) var(--p), var(--sub) calc(var(--p) + 6%)); -webkit-background-clip: text; background-clip: text; }
  .dots span { display: inline-block; width: .5em; height: .5em; border-radius: 50%; margin: 0 .35em; background: var(--unsung); opacity: .4; animation: breathe 1.25s ease-in-out infinite; }
  @keyframes breathe { 50% { transform: scale(1.15); } }
  .title { font-size: clamp(20px, 4.6vw, 44px); font-weight: 700; color: var(--unsung); }
  footer { position: fixed; bottom: 10px; font-size: 11px; opacity: .45; }
  .enter { animation: rise .32s cubic-bezier(.2,.8,.2,1); }
  @keyframes rise { from { transform: translateY(28px); opacity: .2; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<header><b id="song"></b><span id="artist"></span></header>
<div id="stage"></div>
<footer id="credit"></footer>
<script>
const obs = new URLSearchParams(location.search).has("obs");
if (obs) document.body.classList.add("obs");
let state = null, stateAt = 0, lyrics = { lines: [] }, version = -1, shown = -3, duet = false;
const stage = document.getElementById("stage");

async function poll() {
  try {
    const s = await (await fetch("/state", { cache: "no-store" })).json();
    state = s; stateAt = performance.now();
    const r = document.documentElement.style;
    r.setProperty("--unsung", s.colors.unsung); r.setProperty("--sung", s.colors.sung);
    r.setProperty("--next", s.colors.next); r.setProperty("--outline", s.colors.outline);
    r.setProperty("--sub", s.colors.sub);
    document.getElementById("song").textContent = s.title || "";
    document.getElementById("artist").textContent = s.artist || "";
    if (s.v !== version) {
      lyrics = await (await fetch("/lyrics", { cache: "no-store" })).json();
      version = s.v; shown = -3;
      duet = lyrics.lines.some(l => l.a);
      document.getElementById("credit").textContent = lyrics.credit ? "Lyrics: " + lyrics.credit : "";
    }
  } catch (e) { }
  setTimeout(poll, 1000);
}

function now() {
  if (!state) return 0;
  return state.playing ? state.pos + (performance.now() - stateAt) : state.pos;
}

function words(line, cls) {
  if (!line) return "";
  const d = document.createElement("div");
  d.className = cls;
  line.w.forEach((w, i) => {
    if (i > 0 && !w.j) d.append(" ");
    const sp = document.createElement("span");
    sp.className = "w"; sp.textContent = w.t; sp.dataset.s = w.s; sp.dataset.e = w.e;
    d.append(sp);
  });
  return d;
}

function render(idx, t) {
  stage.innerHTML = "";
  const L = lyrics.lines;
  if (!state || !state.title) { stage.innerHTML = '<div class="title">Waiting for music…</div>'; return; }
  if (!L.length) { stage.innerHTML = `<div class="title">${esc(state.artist)} — ${esc(state.title)}</div>`; return; }
  if (idx < 0 || idx === -2) {
    stage.innerHTML = '<div class="line dots"><span></span><span></span><span></span></div>';
  } else {
    const l = L[idx];
    const box = document.createElement("div");
    box.className = "enter " + (l.a ? "trailing" : duet ? "leading duet" : "");
    box.append(words(l.m, "line"));
    if (l.sub) box.append(words(l.sub, "sub"));
    if (l.b) box.append(words(l.b, "bg"));
    if (l.tr && state.showTr) { const tr = document.createElement("div"); tr.className = "tr"; tr.textContent = l.tr; box.append(tr); }
    stage.append(box);
  }
  const ni = idx < 0 ? 0 : idx + 1;
  if (state.showNext && L[ni] && idx !== -2) {
    const n = document.createElement("div");
    n.className = "next " + (L[ni].a ? "trailing" : "");
    n.textContent = L[ni].m.w.map((w, i) => (i > 0 && !w.j ? " " : "") + w.t).join("");
    stage.append(n);
  }
}
function esc(s) { return (s || "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]); }

function frame() {
  const t = now(), L = lyrics.lines;
  let idx = -1;
  if (!lyrics.synced && L.length && state && state.dur) idx = Math.min(L.length - 1, Math.floor(t / state.dur * L.length));
  else for (let i = 0; i < L.length; i++) { if (L[i].m.s <= t) idx = i; else break; }
  // An instrumental break shows the dots.
  if (lyrics.synced && idx >= 0) {
    const cur = L[idx], nx = L[idx + 1];
    const end = Math.max(cur.m.e, cur.b ? cur.b.e : 0);
    if (t > end + 1200 && (!nx || nx.m.s - t > 2200)) idx = nx ? -2 : idx;
  }
  if (idx !== shown || !stage.firstChild) { shown = idx; render(idx, t); }
  if (lyrics.synced) {
    for (const sp of stage.querySelectorAll(".w")) {
      const s = +sp.dataset.s, e = +sp.dataset.e;
      const p = t <= s ? -6 : t >= e ? 106 : (t - s) / Math.max(1, e - s) * 112 - 6;
      sp.style.setProperty("--p", p.toFixed(1) + "%");
    }
  }
  requestAnimationFrame(frame);
}
poll();
requestAnimationFrame(frame);
</script>
</body>
</html>
